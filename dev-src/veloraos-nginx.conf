# VeloraOS HTTPS gateway - managed by VeloraOS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Compatibility redirect for historical VeloraOS URLs using :8099.
server {
    listen 8099 default_server;
    listen [::]:8099 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/veloraos/tls/device.crt;
    ssl_certificate_key /etc/veloraos/tls/device.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VeloraTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /veloraos-local-ca.crt {
        alias /var/lib/veloraos-public/veloraos-local-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="VeloraOS-Local-CA.crt"';
        add_header Cache-Control 'no-store';
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
