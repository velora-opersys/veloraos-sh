name: Diagnose updater checksum parser

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inspect updater checksum parser
        shell: bash
        run: |
          set -Eeuo pipefail
          extract_payload() {
            local script="$1" out="$2" dir="$3"
            python3 - "$script" "$out" <<'PY'
          from pathlib import Path
          import base64, sys
          b = Path(sys.argv[1]).read_bytes()
          marker = b'__VELORA_PAYLOAD_BELOW__\n'
          i = b.rfind(marker)
          if i < 0:
              raise SystemExit('payload marker missing')
          Path(sys.argv[2]).write_bytes(base64.b64decode(b''.join(b[i + len(marker):].split())))
          PY
            mkdir -p "$dir"
            tar -xzf "$out" -C "$dir"
          }
          V116="installer/update/VeloraOS-Update-1.16.0-Platform-Update.sh"
          V200="installer/update/VeloraOS-Update-2.0.0-Aurora-Redesign.sh"
          extract_payload "$V116" /tmp/v116.tar.gz /tmp/v116
          extract_payload "$V200" /tmp/v200.tar.gz /tmp/v200
          echo '=== 1.16.0 exact embedded checksum errors ==='
          grep -RniEi 'declare.*checksum|embedded checksum|embedded.*sha|checksum.*declare|payload.*sha|payload.*checksum' /tmp/v116/app /tmp/v116/installer 2>/dev/null | head -300 || true
          echo '=== 1.16.0 updater validation functions ==='
          grep -nEi 'script|checksum|sha256|embedded|payload' /tmp/v116/app/updater.py | head -220 || true
          echo '=== 1.16.0 updater.py 400-540 ==='
          sed -n '400,540p' /tmp/v116/app/updater.py
          echo '=== 1.16.0 known-good wrapper header ==='
          sed -n '1,120p' "$V116" | grep -Ei 'sha|checksum|payload|embedded|archive|bytes' || true
          echo '=== 2.0.0 known-good wrapper header ==='
          sed -n '1,120p' "$V200" | grep -Ei 'sha|checksum|payload|embedded|archive|bytes' || true
