name: Diagnose updater checksum parser

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inspect published 2.0.1 payload preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT="installer/update/VeloraOS-Update-2.0.1-Aurora-Stability-GPU-Hotfix.sh"
          python3 - "$SCRIPT" /tmp/v201.tar.gz <<'PY'
          from pathlib import Path
          import base64, sys
          b = Path(sys.argv[1]).read_bytes()
          marker = b'__VELORA_PAYLOAD_BELOW__\n'
          i = b.rfind(marker)
          if i < 0:
              raise SystemExit('payload marker missing')
          Path(sys.argv[2]).write_bytes(base64.b64decode(b''.join(b[i + len(marker):].split())))
          PY
          mkdir -p /tmp/v201
          tar -xzf /tmp/v201.tar.gz -C /tmp/v201
          echo '=== exact reported error ==='
          grep -RniF 'update does not declare its embedded checksum' /tmp/v201 2>/dev/null || true
          grep -RniFi 'does not declare its embedded checksum' /tmp/v201 2>/dev/null || true
          echo '=== all declare/checksum/embedded references ==='
          grep -RniEi 'declare.*checksum|checksum.*declare|embedded.*checksum|checksum.*embedded|embedded.*sha|PAYLOAD_SHA|EXPECTED.*SHA|SCRIPT.*SHA' /tmp/v201 2>/dev/null | head -400 || true
          echo '=== installer checksum-related lines ==='
          grep -nEi 'update|checksum|sha256|embedded|payload|declare' /tmp/v201/installer/veloraos-install.sh | head -350 || true
          echo '=== wrapper header ==='
          sed -n '1,180p' "$SCRIPT" | grep -Ei 'update|checksum|sha256|embedded|payload|declare|bytes' || true
