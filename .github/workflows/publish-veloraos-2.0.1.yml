name: Publish VeloraOS 2.0.1

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-veloraos-2.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Reconstruct and publish release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/release/201-patch.part* > .github/release/veloraos-2.0.1.patch.gz.b64
          cat .github/release/201-builder.b64.part* > /tmp/build-2.0.1.sh.b64
          test "$(wc -c < .github/release/veloraos-2.0.1.patch.gz.b64)" = "26956"
          test "$(sha256sum .github/release/veloraos-2.0.1.patch.gz.b64 | awk '{print $1}')" = "62fcddb10fe72a4ea0feb9078ead18245d2ecb7c1fd2cd9322be59165068d7bf"
          test "$(wc -c < /tmp/build-2.0.1.sh.b64)" = "11208"
          test "$(sha256sum /tmp/build-2.0.1.sh.b64 | awk '{print $1}')" = "3e886903a5e9afe29aa717455ada1adb83c949443d4ef30931ccdf1cd0e872bd"
          base64 --decode /tmp/build-2.0.1.sh.b64 > /tmp/build-2.0.1.sh
          test "$(wc -c < /tmp/build-2.0.1.sh)" = "8405"
          test "$(sha256sum /tmp/build-2.0.1.sh | awk '{print $1}')" = "62ab33212d8f088fb2c9f37c6d71e44147131390224fcd7bd92410043fa9a9f3"
          chmod +x /tmp/build-2.0.1.sh
          /tmp/build-2.0.1.sh
