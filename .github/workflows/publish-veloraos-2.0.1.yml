name: Publish VeloraOS 2.0.1

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-veloraos-2.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct and publish release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/release/201-patch.part* > .github/release/veloraos-2.0.1.patch.gz.b64
          cat .github/release/201-builder.part* > /tmp/build-2.0.1.sh
          test "$(wc -c < .github/release/veloraos-2.0.1.patch.gz.b64)" = "26956"
          test "$(sha256sum .github/release/veloraos-2.0.1.patch.gz.b64 | awk '{print $1}')" = "62fcddb10fe72a4ea0feb9078ead18245d2ecb7c1fd2cd9322be59165068d7bf"
          test "$(wc -c < /tmp/build-2.0.1.sh)" = "8221"
          test "$(sha256sum /tmp/build-2.0.1.sh | awk '{print $1}')" = "d51146dcd7bc8cd25f3778405b1d099867d99329e14709c40de8c16ded2840d2"
          chmod +x /tmp/build-2.0.1.sh
          /tmp/build-2.0.1.sh
